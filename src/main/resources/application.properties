#CONFIG APP
server.port=8008
spring.application.name=dentify
app.base-url=${BASE_URL}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
app.cookie.secure=true

platform.admin.email=${ADMIN_EMAIL}
platform.admin.password=${ADMIN_PASSWORD}

#FLIWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#CONFIG DATABASE
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#CONFIG SPRING-SECURITY
spring.security.user.name=${SS_USERNAME}
spring.security.user.password=${SS_PASSWORD}
spring.security.user.roles=${SS_ROLE}

#CONFIG JWT
security.jwt.private.key=${PRIVATE_KEY}
security.jwt.user.generator=${USER_GENERATOR}

#CONFIG MERCADO PAGO
mercadopago.access-token=${MP_TOKEN}
mercadopago.public-key=${MP_KEY}
mercadopago.notification-url=${MP_URL}
mercadopago.webhook.secret=${MP_SECRET}


# TASK EXECUTION
spring.task.execution.thread-name-prefix=dentify-async-
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.wait-for-tasks-on-shutdown=true
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# TASK SCHEDULING
spring.task.scheduling.thread-name-prefix=dentify-scheduler-
spring.task.scheduling.pool.size=5
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# ===============================
# EMAIL (SMTP - GMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# TWILIO (DESHABILITADO HASTA QUE PAGUES)
# ============================================
twilio.enabled=false
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM}

# ============================================
# NOTIFICACIONES
# ============================================
notifications.email.enabled=true
notifications.whatsapp.enabled=false

# ===============================
# SCHEDULER
# ===============================
scheduler.enabled=true

# Payment expiration scheduler
scheduler.payment-expiration.enabled=true
scheduler.payment-expiration.rate=3600000

# No-show check scheduler
scheduler.no-show-check.enabled=true
scheduler.no-show-check.rate=1800000

# Daily reminders scheduler
scheduler.daily-reminders.enabled=true
scheduler.daily-reminders.rate=86400000

# ============================================
# CLOUDINARY
# ============================================
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# BACKBLAZE B2
B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID}
B2_APPLICATION_KEY=${B2_APPLICATION_KEY}
B2_BUCKET_NAME=${B2_BUCKET_NAME}
B2_ENDPOINT=${B2_ENDPOINT}
B2_REGION=${B2_REGION}
B2_PRESIGNED_URL_EXPIRATION_MINUTES=${B2_PRESIGNED_URL_EXPIRATION_MINUTES}
B2_MAX_FILE_SIZE_MB=${B2_MAX_FILE_SIZE_MB}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB